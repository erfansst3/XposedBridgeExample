plugins { id 'com.android.application' }

android {
    namespace 'com.erfansst3.xposedbridgeexample'
    compileSdk 35

    defaultConfig {
        applicationId 'com.erfansst3.xposedbridgeexample'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0-native-diagnostics'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
